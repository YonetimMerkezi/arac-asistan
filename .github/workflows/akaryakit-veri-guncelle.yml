name: Akaryakıt Veri Güncelle

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Veriyi çek ve veri/akaryakit-veri.json'a yaz
        run: node scripts/veri-cek-akaryakit.js

      - name: Değişiklik varsa commit + push
        run: |
          git config user.name "Akaryakit Veri Botu"
          git config user.email "actions@github.com"
          git add veri/akaryakit-veri.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Akaryakıt veri güncelle: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
