# build-android.yml
# -----------------------------------------------------------------------------
# Smart Drive AI - Bulutta Android APK Derleme
#
# Amaç: Sedat'ın bilgisayara ihtiyaç duymadan, yalnızca telefondan yaptığı
# değişiklikleri GitHub'a göndererek (push/upload) çalışan bir APK elde
# edebilmesi. Android platformu repoda TUTULMAZ - her çalışmada
# `npx cap add android` ile sıfırdan üretilir, ardından özel yazılmış native
# dosyalar (Bluetooth eklentisi, arka plan servisi, MainActivity, uygulama
# ikonu/bildirim ikonu/açılış ekranı) geri kopyalanır ve gerekli izinler
# AndroidManifest.xml'e eklenir (bkz. scripts/patch-manifest.js).
#
# Sonuç: Her çalıştırmanın sonunda "Actions" sekmesinde indirilebilir bir
# app-debug.apk artifact'i oluşur - telefonun tarayıcısından indirilip
# doğrudan kurulabilir (bilinmeyen kaynaklara izin vermek gerekir).
# -----------------------------------------------------------------------------
name: Android APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java kur (Gradle için)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sabit debug imzalama anahtarını geri yükle
        # DÜZELTME (kritik hata): "android/" klasörü repoda TUTULMAZ, her
        # çalışmada sıfırdan üretilir - bu da Gradle'ın HER SEFERİNDE
        # rastgele/yeni bir debug.keystore (imzalama sertifikası)
        # oluşturmasına yol açıyordu. Android, farklı sertifikayla imzalanmış
        # bir APK'yı "güncelleme" olarak KABUL ETMEZ - kullanıcı her yeni
        # APK'da öncekini elle silmek zorunda kalıyordu. Çözüm: TEK, SABİT
        # bir debug.keystore üretip GitHub Secrets'ta saklamak ve Gradle'ın
        # varsayılan olarak aradığı ~/.android/debug.keystore konumuna HER
        # ÇALIŞMADA aynısını yerleştirmek - böylece her APK AYNI sertifikayla
        # imzalanır, kurulum "güncelleme" sayılır, silme gerekmez.
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

          # DOĞRULAMA: secret'ın gerçekten okunup okunmadığını VE anahtarın
          # her build'de AYNI olup olmadığını (parmak izi üzerinden) log'da
          # açıkça görünür kılar - "imzalama sorunu hâlâ var mı" sorusunu
          # tahmine değil, doğrudan log çıktısına dayandırır.
          FILE_SIZE=$(stat -c%s ~/.android/debug.keystore 2>/dev/null || stat -f%z ~/.android/debug.keystore)
          echo "Keystore dosya boyutu: ${FILE_SIZE} bayt (boşsa/çok küçükse secret YANLIŞ okunmuş demektir)"

          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret'ı boş veya hatalı görünüyor (dosya çok küçük). GitHub Settings > Secrets kısmını kontrol edin."
            exit 1
          fi

          echo "Keystore SHA256 parmak izi (HER BUILD'DE AYNI olmalı):"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" || echo "UYARI: parmak izi okunamadı - keystore bozuk olabilir."

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps

      - name: Web kaynağını paketle (esbuild)
        run: npm run build

      - name: Özel Android kaynaklarını yedekle
        run: |
          mkdir -p /tmp/custom-android
          cp -r android/app/src/main/java/com/sedat/smartdriveai /tmp/custom-android/

      - name: Android platformunu sıfırdan üret
        run: |
          rm -rf android
          npx cap add android

      - name: Özel plugin/MainActivity/servis dosyalarını geri koy
        run: |
          mkdir -p android/app/src/main/java/com/sedat/smartdriveai
          cp /tmp/custom-android/smartdriveai/*.kt android/app/src/main/java/com/sedat/smartdriveai/

      - name: Kotlin desteğini etkinleştir
        run: node scripts/patch-gradle-kotlin.js

      - name: Uygulama ikonu / bildirim ikonu / açılış ekranını yerleştir
        run: |
          if [ -d "assets/android-res" ]; then
            cp -r assets/android-res/* android/app/src/main/res/
            # GitHub'ın web yükleme ekranı boş klasör kabul etmediği için
            # klasör oluşturmak amacıyla bırakılan yer tutucu dosyaları
            # (ör. "X") temizle - Android kaynak birleştirici yalnızca
            # .xml/.png/.jpg/.jpeg/.webp uzantılarını kabul eder, başka
            # herhangi bir dosya (boş bile olsa) build'i kırar.
            find android/app/src/main/res -type f \
              ! -name "*.xml" ! -name "*.png" ! -name "*.jpg" ! -name "*.jpeg" ! -name "*.webp" \
              -print -delete
            echo "--- res/drawable* içeriği (teşhis) ---"
            find android/app/src/main/res -iname "splash*" -exec ls -la {} \;
            echo "Özel ikon/açılış ekranı kaynakları kopyalandı."
          else
            echo "assets/android-res bulunamadı, Capacitor'ün varsayılan ikonu kullanılacak."
          fi

      - name: İzinleri ve servis kaydını manifest'e ekle
        run: node scripts/patch-manifest.js

      - name: Web varlıklarını Android projesine senkronize et
        run: npx cap sync android

      - name: Gradle ile APK derle (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: KESİN DOĞRULAMA - üretilen APK'nın GERÇEK imzasını göster
        # Önceki adımlar yalnızca "biz bu keystore dosyasını yazdık" ve
        # "build.gradle'a bu ayarı ekledik" diyordu - ama Gradle'ın bunu
        # GERÇEKTEN kullanıp kullanmadığını hiçbir adım DOĞRULAMIYORDU.
        # Bu adım, ÜRETİLEN APK dosyasının içine gömülü GERÇEK imzalama
        # sertifikasını doğrudan okur - varsayıma yer bırakmaz.
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          echo "=== APK'nın GERÇEK imza sertifikası (aşağıdaki SHA256, referans parmak iziyle AYNI olmalı) ==="
          keytool -printcert -jarfile "$APK_PATH" | grep -A1 "SHA256:"

      - name: APK'yı yükle (indirilebilir artifact)
        uses: actions/upload-artifact@v4
        with:
          name: smart-drive-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
